# ==========================================================
# Behavior
# ==========================================================

scrollback_lines 10000

scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +G

enable_audio_bell no

visual_bell_duration 0.08

window_alert_on_bell no


allow_hyperlinks yes


detect_urls yes


mouse_hide_wait 3


clipboard_control \
    write-clipboard \
    write-primary \
    read-clipboard \
    read-primary

term xterm-kitty

cursor_shape block
cursor_blink_interval 0.7
cursor_stop_blinking_after 15
