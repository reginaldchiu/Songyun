# ==========================================================
# Window
# ==========================================================


# Transparency

background_opacity 0.88
dynamic_background_opacity yes


# KDE Wayland Blur

background_blur 0


# Padding

window_padding_width 4


# Size

initial_window_width 120c
initial_window_height 25c


# KDE Plasma

hide_window_decorations no


# Fullscreen

remember_window_size no


# Monitor sync

sync_to_monitor yes

repaint_delay 10
input_delay 3
