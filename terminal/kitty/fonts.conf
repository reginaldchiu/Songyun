# ==========================================================
# Fonts
# ==========================================================


font_family JetBrainsMono Nerd Font

symbol_map U+3000-U+303F Noto Sans CJK SC
symbol_map U+4E00-U+9FFF Noto Snas CJK SC

bold_font auto
italic_font auto
bold_italic_font auto


font_size 12.0


# 字体微调

disable_ligatures never


# OpenType

font_features JetBrainsMonoNerdFont:
    -liga
    -calt
